<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAT Practice</title>
<meta name="description" content="Every College Board SAT question-bank question in seven difficulty bands, digital-format adaptive practice tests, and progress analytics.">
<meta name="theme-color" content="#1d4ed8">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="SAT Practice">
<meta property="og:description" content="Every College Board SAT question-bank question in seven difficulty bands, digital-format adaptive practice tests, and progress analytics. Free, in your browser.">
<meta property="og:image" content="https://bengreff.github.io/sat-practice/docs/preview.png">
<meta property="og:url" content="https://bengreff.github.io/sat-practice/">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <h1>SAT Practice</h1>
    <nav>
      <button data-v="practice">Practice</button>
      <button data-v="tests">Tests</button>
      <button data-v="stats">Stats</button>
      <button data-v="browse">Browse</button>
      <button data-v="plan">Plan</button>
      <button data-v="data">Data</button>
    </nav>
    <span id="sync"></span>
  </div>
  <div id="dl" hidden><div class="dl-fill"></div><div class="wrap dl-text"></div></div>
</header>
<main class="wrap">
  <section id="v-practice" hidden></section>
  <section id="v-tests" hidden></section>
  <section id="v-stats" hidden></section>
  <section id="v-browse" hidden></section>
  <section id="v-plan" hidden></section>
  <section id="v-data" hidden></section>
</main>
<footer class="wrap foot">Free and open source (<a href="https://github.com/bengreff/sat-practice">github.com/bengreff/sat-practice</a>).
  Not affiliated with or endorsed by College Board. SAT is a registered trademark of College Board; the questions come from
  its public SAT Suite Question Bank.</footer>
<noscript>This app needs JavaScript.</noscript>
<script type="module" src="app/main.js"></script>
</body>
</html>
