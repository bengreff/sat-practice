name: Bug or suggestion
description: Something doesn't work, or an idea to make the site better.
labels: ["feedback"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, or what would you like?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Practice
        - Tests
        - Score report
        - Stats
        - Browse
        - Plan
        - Data, downloading questions
        - Somewhere else
  - type: input
    id: device
    attributes:
      label: Browser and device
      description: Filled in for you when you use the link in the app.
