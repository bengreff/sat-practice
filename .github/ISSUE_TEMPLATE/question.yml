name: Problem with a question
description: A wrong answer key, a wrong or confusing explanation, or a question that doesn't display properly.
title: "Question "
labels: ["question"]
body:
  - type: input
    id: question
    attributes:
      label: Question ID
      description: Shown as #xxxxxxxx next to the difficulty band. Filled in for you when you use the Report link.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Section, skill and band
  - type: dropdown
    id: kind
    attributes:
      label: What's wrong?
      options:
        - The answer key is wrong
        - The explanation is wrong or confusing
        - It doesn't display properly (math, picture, table)
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What did you expect, and what did you see? A screenshot helps.
